[General]
# --- Fondo ---
# Ruta relativa a esta carpeta o absoluta. Si no existe, se usa baseColor.
background=backgrounds/default.png
# Oscurecer el fondo: 0 (nada) a 1 (negro)
dimBackground=0.2

# --- Disposicion ---
# Lado del panel de inicio de sesion: right o left (el reloj va al lado contrario)
panelSide=right
# Ancho del panel en % del ancho de pantalla (18 a 60)
panelWidthPercent=26
showClock=true
# Formatos de Qt: https://doc.qt.io/qt-6/qml-qtqml-qt.html#formatTime-method
clockFormat=HH:mm
dateFormat=dddd, d MMMM
# Idioma de la fecha. Vacio = el del sistema. Si el login sale en ingles, prueba: locale=es_ES
locale=

# --- Elementos ---
# Selector de usuario: auto (solo si hay varios), true o false
showUserSelector=auto
# Selector de sesion: auto (solo si hay varias sesiones), true o false
showSessionSelector=auto
showPowerButtons=true
showHibernate=false

# --- Colores (por defecto, Catppuccin Mocha) ---
baseColor=#11111b
# Formato #AARRGGBB: los dos primeros digitos son la opacidad
panelColor=#cc11111b
fieldColor=#313244
borderColor=#45475a
accentColor=#cba6f7
accentTextColor=#11111b
textColor=#cdd6f4
mutedColor=#9399b2
dangerColor=#f38ba8
